services:
  - type: web
    name: continuityos-api
    runtime: docker
    region: oregon
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: continuityos-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: STORAGE_DIR
        value: /tmp/continuityos-storage
      - key: BACKEND_CORS_ORIGINS
        value: https://continuityos-web.onrender.com

  - type: web
    name: continuityos-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://continuityos-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: continuityos-db
    region: oregon
    plan: free
    databaseName: continuityos
    user: continuityos
