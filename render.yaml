services:
  - type: web
    name: continuityos-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: continuityos-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: STORAGE_DIR
        value: /tmp/continuityos-storage
      - key: BACKEND_CORS_ORIGINS
        value: https://continuityos-web.onrender.com

  - type: web
    name: continuityos-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://continuityos-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: continuityos-db
    region: oregon
    plan: free
    databaseName: continuityos
    user: continuityos
